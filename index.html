<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Nass Strength"><meta name="theme-color" content="#E8EBE5"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><link rel="manifest" href="manifest.json"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Nass Strength</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone logbook. Sticky header, scrolling exercise cards, rest timer docked above a bottom tab bar.
   Plate colours encode exercise type: blue = weight × reps, green = cardio, yellow = timed hold. */
:root{
  --bg:#E8EBE5; --surface:#F7F8F4; --sunk:#DCE1D9; --ink:#141915; --muted:#56605A; --line:#C9D0C6;
  --accent:#2246C4; --accent-ink:#FFFFFF; --accent-soft:#D8DFF6;
  --plate-red:#C42F28; --plate-blue:#2246C4; --plate-yellow:#C9970F; --plate-green:#23794A;
  --good:#1D7A44; --warn:#A66A0B; --bad:#B4372F;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --r:16px; --tabh:62px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101311; --surface:#191D1A; --sunk:#232824; --ink:#E7EBE5; --muted:#99A39B; --line:#2D3430;
  --accent:#7F97FF; --accent-ink:#0C0F1D; --accent-soft:#222A47;
  --plate-red:#FF6D61; --plate-blue:#7F97FF; --plate-yellow:#EFC23C; --plate-green:#52C281;
  --good:#58CA88; --warn:#E9B04A; --bad:#FF7B70; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#101311; --surface:#191D1A; --sunk:#232824; --ink:#E7EBE5; --muted:#99A39B; --line:#2D3430;
  --accent:#7F97FF; --accent-ink:#0C0F1D; --accent-soft:#222A47;
  --plate-red:#FF6D61; --plate-blue:#7F97FF; --plate-yellow:#EFC23C; --plate-green:#52C281;
  --good:#58CA88; --warn:#E9B04A; --bad:#FF7B70; color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:400 15px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto}


/* language picker */
.top-r{display:flex;align-items:center;gap:10px;min-width:0}
.lang-btn{display:flex;align-items:center;gap:5px;padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;color:var(--ink)}
.lang-sheet{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.lang-sheet[hidden]{display:none!important}
.lang-panel{background:var(--surface);width:100%;max-width:560px;max-height:82vh;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.lang-h{display:flex;justify-content:space-between;align-items:center;font-size:17px}
#lang-q{font:inherit;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.lang-list{overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin:0 -4px}
.lang-list button{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:12px;border-radius:10px;font-size:16px}
.lang-list button:active,.lang-list button[aria-current="true"]{background:var(--accent-soft)}
.lang-list small{color:var(--muted);font-size:13px}
.lang-note{margin:0;font-size:12px;color:var(--muted)}
/* hide Google's own translate bar */
iframe.skiptranslate,.goog-te-banner-frame,#goog-gt-tt,.goog-te-balloon-frame,.VIpgJd-ZVi9od-ORHb-OEVmcd,.VIpgJd-ZVi9od-aZ2wEe-wOHMyf{display:none!important}
body{top:0!important;position:static!important}
.goog-text-highlight{background:none!important;box-shadow:none!important}
.brand{white-space:nowrap}
@media (max-width:440px){.sync{font-size:0!important;gap:0!important}.top .wrap{gap:8px!important}.brand{font-size:22px!important}}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font:800 24px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase}
.mark{display:flex;align-items:center;gap:2px}
.mark i{display:block;width:5px;border-radius:2px}
.mark i:nth-child(1){height:22px;background:var(--plate-red)}
.mark i:nth-child(2){height:18px;background:var(--plate-blue)}
.mark i:nth-child(3){height:14px;background:var(--plate-yellow)}
.mark i:nth-child(4){height:10px;background:var(--plate-green)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync[data-s="cloud"]::before{background:var(--good)}
.sync[data-s="demo"]::before{background:var(--warn)}

main{padding-block:16px calc(var(--tabh) + 150px + env(safe-area-inset-bottom,0px))}
main .wrap{display:flex;flex-direction:column;gap:14px}

h1,h2,h3{margin:0;text-wrap:balance}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.big{font:800 40px/1 var(--f-display);text-transform:uppercase;letter-spacing:.01em}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;font-weight:700;background:var(--sunk);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{color:var(--bad)}
.btn.small{min-height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.confirm{background:var(--bad);color:var(--surface)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.row-btns>.btn{flex:1 1 auto}

.banner{background:var(--accent-soft);border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}
.banner b{font-weight:700}

/* session head */
.sess-head{display:flex;flex-direction:column;gap:6px}
.title-in{width:100%;font:800 30px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.01em;background:transparent;border:0;border-bottom:2px dashed var(--line);color:var(--ink);padding:2px 0 4px;border-radius:0}
.title-in::placeholder{color:var(--muted);opacity:.6}
.sess-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.sess-meta b{color:var(--ink);font-weight:700}

/* exercise card */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ex-h{display:flex;align-items:flex-start;gap:10px;padding:14px 14px 10px}
.plate{flex:none;width:10px;height:26px;border-radius:3px;margin-top:2px;background:var(--plate-blue)}
.plate.cardio,.plate.sprint{background:var(--plate-green)} .plate.time{background:var(--plate-yellow)}
.ex-title{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.ex-title h3{font:800 22px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.01em;overflow-wrap:anywhere}
.ex-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.range{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 4px 0 10px;border-radius:999px;background:var(--sunk);font-size:12px;font-weight:600;color:var(--muted)}
.range input{width:62px;height:22px;border:0;border-radius:999px;background:var(--surface);color:var(--ink);font:600 13px var(--f-body);text-align:center}
.x{flex:none;width:36px;height:36px;border-radius:10px;color:var(--muted);display:grid;place-items:center}
.x.armed{background:var(--bad);color:var(--surface);width:auto;padding:0 10px;font-size:13px;font-weight:700}

.cmp{margin:0 14px;padding:10px 12px;border-radius:12px;background:var(--sunk);display:flex;flex-direction:column;gap:6px;font-size:13px}
.cmp-row{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:baseline}
.cmp-row .when{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cmp-row .when small{display:block;font-weight:500;letter-spacing:0;text-transform:none}
.sets-txt{display:flex;flex-wrap:wrap;gap:4px 10px;font-weight:600}
.sets-txt span sup{font-size:10px;color:var(--muted);margin-left:1px}
.cue{font-size:12px;color:var(--good);font-weight:600}

.sets{padding:10px 14px 4px;display:flex;flex-direction:column;gap:6px}
.srow{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 46px;gap:8px;align-items:center}
.srow.c1{grid-template-columns:28px minmax(0,1fr) 46px}
.sets.wl .srow{grid-template-columns:28px 64px minmax(0,1fr) minmax(0,1fr) 46px;gap:6px}
.sets.wl .srow.c1{grid-template-columns:28px 64px minmax(0,1fr) 46px}
.last{font-size:12px;font-weight:600;color:var(--muted);line-height:1.15;display:flex;flex-direction:column;align-items:flex-start;gap:2px;overflow-wrap:anywhere}
.mk{font-style:normal;font-size:11px;font-weight:800;line-height:1}
.mk.up{color:var(--good)} .mk.down{color:var(--bad)} .mk.same{color:var(--muted)}
.in::placeholder{color:var(--muted);opacity:.5;font-weight:500}
.srow.pre .tick{border-style:dashed}
.srow.hd{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center}
.sn{font:800 18px/1 var(--f-display);text-align:center;color:var(--muted)}
.sn.in{color:var(--good)} .sn.under{color:var(--warn)} .sn.over{color:var(--accent)}
.in{width:100%;min-width:0;height:46px;font:600 18px var(--f-body);font-variant-numeric:tabular-nums;text-align:center;background:var(--sunk);border:1px solid transparent;border-radius:12px;color:var(--ink);padding:0 4px}
.in::placeholder{color:var(--muted);opacity:.55}
.srow.done .in{background:transparent;border-color:var(--line)}
.tick{width:46px;height:46px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.tick[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--surface)}
.ex-f{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px 14px;flex-wrap:wrap}
.ex-f .row-btns{flex:none}
.live{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.live b{color:var(--ink)}
.delta{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.delta.up{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.delta.down{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.note-in{margin:0 14px 12px;width:calc(100% - 28px);border:1px dashed var(--line);background:transparent;border-radius:10px;padding:8px 10px;font:400 14px var(--f-body);color:var(--ink)}
.note-in::placeholder{color:var(--muted)}

.quick{display:flex;flex-wrap:wrap;gap:8px}
.quick .chip{height:36px;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line)}

/* start screen */
.tpl{display:flex;flex-direction:column;gap:8px}
.tpl button{display:flex;align-items:center;gap:12px;text-align:left;padding:12px;border-radius:12px;background:var(--sunk);min-height:56px}
.tpl .tn{font:800 19px/1.05 var(--f-display);text-transform:uppercase}
.tpl .ts{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tpl .tm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tpl .go{font-weight:700;color:var(--accent);font-size:13px;flex:none}

.summary .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--sunk);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font:800 26px/1 var(--f-display)}
.stat span{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.pr{display:flex;align-items:center;gap:8px;font-size:14px}
.pr::before{content:"PR";font:800 12px/1 var(--f-display);letter-spacing:.06em;background:var(--plate-red);color:var(--surface);padding:4px 6px;border-radius:4px}

/* history */
.month{font:800 16px/1 var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:6px 2px 0}
.h-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.h-head{width:100%;display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;text-align:left}
.h-row{display:flex;align-items:stretch}
.h-row .h-head{flex:1 1 auto;min-width:0;padding-right:6px}
.h-trash{flex:0 0 auto;display:flex;align-items:center;justify-content:center;min-width:44px;margin:8px 8px 8px 0;padding:0 8px;border-radius:10px;color:var(--muted);font-size:12px;font-weight:700;white-space:nowrap}
.h-trash svg{width:18px;height:18px}
.h-trash:active{background:var(--sunk)}
.h-trash.armed{background:var(--bad);color:var(--surface);padding:0 12px}
.h-date{display:flex;flex-direction:column;align-items:center;line-height:1}
.h-date b{font:800 28px/1 var(--f-display)}
.h-date span{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.h-main h3{font:800 19px/1.1 var(--f-display);text-transform:uppercase}
.h-main p{margin:2px 0 0;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h-meta{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
.h-meta b{display:block;color:var(--ink);font-size:14px}
.h-body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.h-ex{display:grid;grid-template-columns:10px minmax(0,1fr);gap:10px}
.h-ex .plate{height:18px;width:6px}
.h-ex h4{margin:0;font-size:14px;font-weight:700}
.h-ex h4 small{font-weight:500;color:var(--muted)}
.h-ex .sets-txt{font-size:13px;font-weight:500}
.h-ex .nt{font-size:12px;color:var(--muted);font-style:italic}

/* progress */
.sel{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 16px var(--f-body);padding:0 12px}
.seg{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:12px;overflow-x:auto}
.seg button{flex:1 0 auto;height:36px;padding:0 10px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px color-mix(in srgb,var(--ink) 14%,transparent)}
.kpi{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.kpi .big{font-size:44px}
.kpi .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.c-grid{stroke:var(--line);stroke-width:1}
.c-axis{fill:var(--muted);font:500 11px var(--f-body)}
.c-area{fill:var(--accent);fill-opacity:.12}
.c-line{stroke:var(--accent);stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
.c-dot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.c-end{fill:var(--accent)}
.c-best{stroke:var(--plate-red);stroke-width:1.5;stroke-dasharray:4 4}
.c-endlab{fill:var(--ink);font:700 12px var(--f-body)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:700;padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;padding-right:0}

.empty{text-align:left;display:flex;flex-direction:column;gap:10px}
.empty p{margin:0;color:var(--muted)}
.link{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* rest timer */
.timer{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));z-index:30;background:var(--surface);border-top:1px solid var(--line)}
.timer .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px}
.t-left{display:flex;flex-direction:column;line-height:1;min-width:84px}
.t-lab{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.t-time{font:800 38px/1 var(--f-display)}
.t-ctrl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.t-ctrl .chip{height:34px;font-size:13px}
.t-bar{height:4px;background:var(--sunk)}
.t-bar i{display:block;height:100%;width:0;background:var(--plate-red);transition:width .25s linear}
.timer.running .t-time{color:var(--plate-red)}
.timer.done{background:var(--plate-red)}
.timer.done .t-time,.timer.done .t-lab{color:var(--surface)}
.timer.done .btn{background:var(--surface);color:var(--plate-red)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] svg{color:var(--accent)}
.tabs svg{width:22px;height:22px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-bg{position:absolute;inset:0;background:color-mix(in srgb,var(--ink) 40%,transparent)}
.sheet-panel{position:relative;background:var(--surface);border-radius:20px 20px 0 0;max-height:86%;display:flex;flex-direction:column;padding-top:12px;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-panel .wrap{width:100%}
.sheet-h{display:flex;gap:8px;padding-bottom:10px}
.sheet-h input{flex:1;min-width:0;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);font:500 16px var(--f-body);padding:0 12px}
.ex-list{overflow-y:auto;padding-bottom:16px}
.ex-list .wrap{display:flex;flex-direction:column;gap:2px}
.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line)}
.pick .plate{height:20px;width:8px;margin:0}
.pick .pn{flex:1;min-width:0;font-weight:600}
.pick .ps{font-size:12px;color:var(--muted);white-space:nowrap}
.newex{background:var(--sunk);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.newex .row-btns .btn{flex:1 1 30%}

/* ---------- hand-written interface text (ko.js); replaces English text on screen ---------- */
const UI={d:null};
function trText(s){
  const U=UI.d; if(!U||!s) return null;

const IDX={map:null,byG:null,cache:new Map()};

function buildIdx(){

  (L.data||[]).forEach(x=>{ const k=snj(x.n), g='L:'+k; byG.set(g,x); m.set(k,g); (x.a||[]).forEach(a=>{ const ak=snj(a); if(!m.has(ak)) m.set(ak,g) }) });

}
function gid(name){

}
const sameEx=(a,b)=>gid(a)===gid(b);

/* favourites: anything you have logged is starred automatically, plus ones you star; un-starring a logged one is remembered */

}
function rootName(e){ const k=e.g.slice(2); if(e.g.startsWith('L:')&&e.lib&&snj(e.lib)===k) return e.lib; return (e.allNames||[]).concat([e.n]).find(n=>snj(n)===k)||k }
function libEntries(){
  if(!IDX.map) buildIdx();

    if(groups.has(g)){ const t=groups.get(g);

    if(g!==g0){ e.mergedInto=true } groups.set(g,e) });

    const g=gid(ex.name); let e=groups.get(g);

function catMatch(x,c){ if(c==='all') return true; if(x.own) return c==='strength'; if(c==='cardio') return x.c==='cardio'||x.c==='plyometrics'; if(c==='olympic') return x.c==='olympic weightlifting'||x.c==='powerlifting'; return x.c===c }
function anyFilter(){ return L.q.trim()||L.mus.length||L.cat!=='all'||L.star||L.mine||L.showHidden }
function filtered(list){
  const words=sn(L.q), qj=words.join(' '), eq=new Set(P.equipment), hid=hidSet(), fav=favSet();
  return list.filter(x=>{
    if(!L.showHidden&&hid.has(x.k)) return false;
    if(L.star&&!fav.has(x.k)) return false;
    if(L.mine&&!(x.used||x.own)) return false;
    if(eq.size&&!x.own&&!eq.has(x.e)) return false;
    if(L.mus.length&&!L.mus.some(m=>x.p.includes(m))) return false;
    if(!catMatch(x,L.cat)) return false;
    if(words.length&&!words.every(w=>x.h.includes(w)||x.hc.includes(w))) return false;

  }).sort((a,b)=>{

function planNames(){
  const m=new Map();

function all(){return S.demo?S.demoData:S.sessions}
function active(){return all().find(s=>!s.finishedAt)||null}
function finished(){return all().filter(s=>s.finishedAt).sort((a,b)=>b.startedAt-a.startedAt)}
function byId(id){return all().find(s=>s.id===id)}

function persistLocal(){ lsSet(LS_DATA,S.sessions) }
function save(s,now){
  if(S.demo||!s) return;

  if(!cloud.col) return;
  cloud.dirty.add(s.id);

  if(now) flush(s.id); else cloud.timers[s.id]=setTimeout(()=>flush(s.id),700);
}
function flush(id){
  clearTimeout(cloud.timers[id]); delete cloud.timers[id];
  const prev=cloud.chains[id]||Promise.resolve();
  cloud.chains[id]=prev.then(async()=>{
    const s=S.sessions.find(x=>x.id===id); if(!s||!cloud.col) return;
    try{ await cloud.col.doc(id).set(JSON.parse(JSON.stringify(s))) }
    catch(e){ cloudError(e) }
    finally{ if(!cloud.timers[id]) cloud.dirty.delete(id) }
  });
}
function flushAll(){ Object.keys(cloud.timers).forEach(flush) }
function removeSession(id){
  if(S.demo){ S.demoData=S.demoData.filter(s=>s.id!==id); return }

  if(!cloud.col) return;

}
function cloudError(e){

}
function setSync(s){ S.sync=s; renderSync() }
function renderSync(){

  el.dataset.s=S.sync;
  el.textContent=S.sync==='cloud'?'Saved to your account':S.sync==='syncing'?'Connecting…':'On this device';
}

async function connectCloud(){
  if(!window.claude||typeof window.claude.use!=='function') return;
  let db=null; try{ db=await window.claude.use('db') }catch(e){}
  if(!db) return;
  let col; try{ col=db.collection('sessions') }catch(e){ return }
  setSync('syncing');
  try{
    const pref=db.doc('meta/prefs');
    pref.onSnapshot(snap=>{
      if(!PC.ref){ if(snap.metadata.fromCache) return; PC.ref=pref; if(!snap.exists){ if(hasPrefs()) savePrefs(); return } }
      if(PC.pending||!snap.exists) return;
      const next=Object.assign(PREF_DEFAULTS(),JSON.parse(JSON.stringify(snap.data()||{})));
      if(JSON.stringify(next)===JSON.stringify(P)) return;
      Object.keys(next).forEach(k=>{ P[k]=next[k] }); lsSet(LS_PREFS,P); invalidateNames();
      if(!typingNow()) render();
    },()=>{ PC.ref=null });
  }catch(e){}
  const seen=lsGet(LS_SEEN,false);
  col.onSnapshot(snap=>{
    if(!cloud.ready){
      if(snap.metadata.fromCache) return;
      cloud.ready=true; cloud.col=col;
      if(!seen){
        const remoteIds=new Set(snap.docs.map(d=>d.id));
        S.sessions.forEach(s=>{ if(!remoteIds.has(s.id)) save(s,true) });
        lsSet(LS_SEEN,true);
      }
    }
    applyRemote(snap.docs); setSync('cloud');
  },()=>{ cloud.col=null; setSync('local') });
}
function sig(arr){ return JSON.stringify(arr.slice().sort((a,b)=>a.id<b.id?-1:1)) }
function applyRemote(docs){
  const map=new Map();
  docs.forEach(d=>{ const v=d.data(); if(v&&v.id) map.set(v.id,JSON.parse(JSON.stringify(v))) });
  cloud.dirty.forEach(id=>{ const l=S.sessions.find(s=>s.id===id); if(l) map.set(id,l) });
  cloud.deleted.forEach(id=>map.delete(id));
  const next=[...map.values()];
  if(sig(next)===sig(S.sessions)) return;
  S.sessions=next; persistLocal();
  if(!S.demo && !typingNow()) render();
}
function typingNow(){ const a=document.activeElement; return a&&a.tagName==='INPUT'&&view.contains(a) }

/* ---------- formatting & maths ---------- */
function num(n,d){ if(n==null||!isFinite(n)) return '–'; return Number(n).toLocaleString('en-US',{maximumFractionDigits:d==null?1:d}) }

function parseNum(v){ const n=parseFloat(String(v).replace(',','.')); return isNaN(n)?null:n }
function parseTime(v,kind){ v=String(v||'').trim(); if(!v) return null;

  if(v.includes(':')){ const p=v.split(':').map(Number); if(p.some(isNaN)) return null; return p.reduce((a,b)=>a*60+b,0) }
  const n=parseFloat(v.replace(',','.')); if(isNaN(n)) return null; return kind==='cardio'?Math.round(n*60):Math.round(n) }
function parseRange(str){ const m=String(str||'').match(/(\d+)\s*[-–~to ]+\s*(\d+)/); if(!m){ const one=parseInt(str,10); return isNaN(one)?null:{lo:one,hi:one} } const a=+m[1],b=+m[2]; return {lo:Math.min(a,b),hi:Math.max(a,b)} }
function hasData(s,kind){ if(!s) return false; if(kind==='strength') return s.r>0; if(kind==='cardio'||kind==='sprint') return s.t>0||s.d>0; return s.t>0 }
function duOf(name){ if(!IDX.map) buildIdx(); const x=IDX.byG&&IDX.byG.get(gid(name)); return x&&x.du==='m'?'m':'km' }
function exDU(ex){ return ex.kind==='cardio'?(ex.du||'km'):null }
function fieldsOf(ex){ return ex.kind==='cardio'&&exDU(ex)==='m'?FIELDS.cardioM:FIELDS[ex.kind] }
function kmOf(d,ex){ return d==null?0:(exDU(ex)==='m'?d/1000:d) }
function fieldVal(v,k,kind){ if(v==null) return ''; if(k==='t'){ if(kind==='sprint') return String(v); if(kind==='cardio') return v%60===0?String(v/60):fmtT(v); return String(v) } return String(v) }
/* ---------- units: each exercise stores weights in the unit you typed (ex.u); older records are kg ---------- */
const LB=2.2046226218;
function exU(ex){ return ex&&ex.u==='lb'?'lb':'kg' }
function conv(w,from,to){ if(w==null) return w; return from===to?w:(to==='lb'?w*LB:w/LB) }
const niceW=w=>Math.round(w*2)/2;
function showW(kg,d){ return num(conv(kg,'kg',P.unit),d==null?1:d)+' '+P.unit }
function setLabel(s,ex,to){
  if(ex.kind==='strength'){ const from=exU(ex); to=to||from; const cw=v=>{ v=v||0; return to!==from?niceW(conv(v,from,to)):v };
    let w=cw(s.w); const base=ex.bw?(w?'BW+'+num(w,2):'BW')+'×'+s.r:num(w,2)+'×'+s.r;
    const ds=(s.drops||[]).filter(d=>d&&d.r>0&&!d.pre); return ds.length?base+ds.map(d=>' → '+num(cw(d.w),2)+'×'+d.r).join(''):base }
  if(ex.kind==='sprint'){ const p=[]; if(s.d) p.push(num(s.d,0)+' m'); if(s.t) p.push(num(s.t,2)+' s'); return p.join(' · ') }
  if(ex.kind==='cardio'){ const p=[]; if(s.d) p.push(exDU(ex)==='m'?num(s.d,0)+' m':num(s.d,2)+' km'); if(s.t) p.push(fmtT(s.t)); return p.join(' · ') }
  return fmtT(s.t)
}
function grouped(ex,to){
  const out=[]; ex.sets.filter(s=>hasData(s,ex.kind)).forEach(s=>{ const l=setLabel(s,ex,to); const last=out[out.length-1]; if(last&&last.l===l) last.n++; else out.push({l,n:1}) });
  return out.map(g=>'<span>'+esc(g.l)+(g.n>1?'<sup>×'+g.n+'</sup>':'')+'</span>').join('');
}
function stats(ex){
  const sets=ex.sets.filter(s=>hasData(s,ex.kind)&&!s.pre);
  if(ex.kind==='strength'){ let top=0,e1=0,ton=0,reps=0; const u=exU(ex); sets.forEach(s=>{ const w=conv(s.w||0,u,'kg'),r=s.r||0; top=Math.max(top,w); e1=Math.max(e1,r===1?w:w*(1+r/30)); ton+=w*r; reps+=r; liveDrops(s.drops).forEach(d=>{ const dw=conv(d.w||0,u,'kg'); ton+=dw*d.r; reps+=d.r }) }); return {sets:sets.length,top,e1rm:e1,ton,reps} }
  if(ex.kind==='sprint'){ let best=null,dist=0,spd=0; sets.forEach(s=>{ if(s.t>0) best=best==null?s.t:Math.min(best,s.t); dist+=s.d||0; if(s.t>0&&s.d>0) spd=Math.max(spd,s.d/s.t) }); return {sets:sets.length,best,dist,speed:spd||null} }
  if(ex.kind==='cardio'){ let t=0,d=0,dm=0; sets.forEach(s=>{ t+=s.t||0; d+=kmOf(s.d,ex); if(exDU(ex)==='m') dm+=s.d||0 }); return {sets:sets.length,time:t,dist:d,distm:dm||null,pace:d>0&&t>0?t/d:null,pace100:dm>0&&t>0?t/(dm/100):null} }
  let mx=0,tot=0; sets.forEach(s=>{mx=Math.max(mx,s.t||0);tot+=s.t||0}); return {sets:sets.length,max:mx,total:tot};
}
function historyFor(name,excludeId){
  const g=gid(name), out=[];
  finished().forEach(s=>{ if(s.id===excludeId) return; const ex=s.exercises.find(e=>gid(e.name)===g&&e.sets.some(x=>hasData(x,e.kind))); if(ex) out.push({session:s,ex}) });
  return out;
}
function suggest(ex,i,prev){
  if(i>0){ const p=ex.sets[i-1]; if(hasData(p,ex.kind)) return p }
  if(prev){ const ps=prev.ex.sets.filter(x=>hasData(x,prev.ex.kind)); const src=ps[i]||ps[ps.length-1]||null;
    if(src&&ex.kind==='strength'&&exU(prev.ex)!==exU(ex)&&src.w!=null) return Object.assign({},src,{w:niceW(conv(src.w,exU(prev.ex),exU(ex)))});
    return src }
  return null;
}
function repStatus(r,range){ if(!range||!(r>0)) return ''; if(r>range.hi) return 'over'; if(r>=range.lo) return 'in'; return 'under' }
function sessionSets(s){ return s.exercises.reduce((a,ex)=>a+ex.sets.filter(x=>hasData(x,ex.kind)&&!x.pre).length,0) }
function sessionTon(s){ return s.exercises.reduce((a,ex)=>a+(ex.kind==='strength'?stats(ex).ton:0),0) }
function blankSet(){ return {w:null,r:null,t:null,d:null,done:false} }
function sessionName(s){ return s.title||fmtDate(s.startedAt,{weekday:'long'}) }

/* known exercises: history first, then defaults */
function knownExercises(){
  const m=new Map();
  const hayOf=(g,name)=>sn(namesOf(g).concat([name]).join(' ')).join(' ');
  all().slice().sort((a,b)=>b.startedAt-a.startedAt).forEach(s=>s.exercises.forEach(ex=>{ const g=gid(ex.name); if(!m.has(g)) m.set(g,{g,name:P.display[g]||ex.name,kind:ex.kind,last:s.startedAt,count:0}); m.get(g).count++ }));
  P.custom.forEach(c=>{ const g=gid(c.n); if(!m.has(g)) m.set(g,{g,name:P.display[g]||c.n,kind:c.kind,last:0,count:0}) });
  if(L.data){
    const eq=new Set(P.equipment), hid=hidSet(), fav=favSet();
    L.data.forEach(x=>{ const g=gid(x.n); if(m.has(g)||hid.has(g)) return; if(eq.size&&!eq.has(x.e)) return; m.set(g,{g,name:P.display[g]||x.n,kind:kindOf(x),last:0,count:0,fav:fav.has(g)}) });
  } else DEFAULTS.forEach(([n,k])=>{ const g=gid(n); if(!m.has(g)) m.set(g,{g,name:n,kind:k,last:0,count:0}) });
  const out=[...m.values()]; out.forEach(x=>{ x.hay=hayOf(x.g,x.name) }); return out;
}

/* ---------- rest timer ---------- */
const T={end:0,dur:0,running:false,done:false,h:null,mode:null};
let AC=null;
function ensureAudio(){ try{ if(!AC){ const C=window.AudioContext||window.webkitAudioContext; if(C) AC=new C() } if(AC&&AC.state==='suspended') AC.resume() }catch(e){} }
function alarm(){
  if(AC){ try{ const now=AC.currentTime; [0,.32,.64].forEach((o,i)=>{ const osc=AC.createOscillator(),g=AC.createGain(); osc.frequency.value=i===2?1175:880; g.gain.setValueAtTime(.0001,now+o); g.gain.exponentialRampToValueAtTime(.35,now+o+.02); g.gain.exponentialRampToValueAtTime(.0001,now+o+.26); osc.connect(g); g.connect(AC.destination); osc.start(now+o); osc.stop(now+o+.3) }) }catch(e){} }
  try{ navigator.vibrate&&navigator.vibrate([250,120,250]) }catch(e){}
}
function startRest(sec){ ensureAudio(); T.dur=sec; T.end=Date.now()+sec*1000; T.running=true; T.done=false; tick() }
function tick(){
  clearTimeout(T.h);
  if(!T.running){ renderTimer(); return }
  const left=T.end-Date.now();
  if(left<=0){ T.running=false; T.done=true; alarm(); renderTimer(); setTimeout(()=>{ if(!T.running){ T.done=false; renderTimer() } },5000); return }
  renderTimer(); T.h=setTimeout(tick,250);
}
function renderTimer(){
  const el=$('#timer'); const a=active();
  const show=T.running||T.done||(S.tab==='log'&&!!a);
  el.hidden=!show; if(!show) return;
  const mode=T.done?'done':T.running?'running':'idle';
  el.className='timer '+mode;
  const left=T.running?Math.max(0,T.end-Date.now())/1000:0;
  $('#t-lab').textContent=mode==='done'?'Rest over':mode==='running'?'Resting':'Rest timer';
  $('#t-time').textContent=mode==='idle'?fmtT(S.settings.rest):fmtT(Math.ceil(left));
  $('#t-fill').style.width=mode==='running'?(left/T.dur*100)+'%':mode==='done'?'100%':'0%';
  const key=mode+':'+S.settings.rest;
  if(T.mode===key) return; T.mode=key;
  let h='';
  if(mode==='idle'){ h=[60,90,120,180].map(v=>'<button class="chip" data-act="rest-preset" data-v="'+v+'" aria-pressed="'+(S.settings.rest===v)+'">'+fmtT(v)+'</button>').join('')+'<button class="btn small primary" data-act="rest-start">Start</button>' }
  else if(mode==='running'){ h='<button class="btn small" data-act="rest-add" data-v="-15">−15</button><button class="btn small" data-act="rest-add" data-v="15">+15</button><button class="btn small primary" data-act="rest-skip">Skip</button>' }
  else { h='<button class="btn small" data-act="rest-skip">Next set</button>' }
  $('#t-ctrl').innerHTML=h;
}

function viewLog(){
  const a=active();
  if(!a) return viewStart();
  let h='<section class="sess-head">'
    +'<span class="eyebrow">'+esc(fmtDate(a.startedAt,{weekday:'short',day:'numeric',month:'short'}))+'</span>'
    +'<input class="title-in" id="sess-title" list="wo-names" value="'+esc(a.title)+'" placeholder="Workout name" aria-label="Workout name" autocomplete="off">'
    +'<datalist id="wo-names">'+[...new Set(finished().map(s=>s.title).filter(Boolean))].map(n=>'<option value="'+esc(n)+'">').join('')+'</datalist>'
    +'<div class="sess-meta"><span>Time <b id="elapsed">'+fmtT((Date.now()-a.startedAt)/1000)+'</b></span><span>Volume <b id="sess-sets">'+sessionSets(a)+' sets</b></span>'
    +(a.exercises.length>1&&!S.reorder?'<button class="btn small ghost ro-btn" data-act="ro-open">⇅ Reorder</button>':'')+'</div>'
    +'</section>';
  if(S.reorder&&a.exercises.length>1) return h+reorderView(a);
  S.reorder=false;
  a.exercises.forEach(ex=>{ h+=exCard(a,ex) });
  h+='<button class="btn block primary" data-act="add-ex">+ Add exercise</button>';
  if(!a.exercises.length){
    const recent=knownExercises().filter(k=>k.count).slice(0,8);
    if(recent.length) h+='<div class="quick">'+recent.map(k=>'<button class="chip" data-act="pick" data-name="'+esc(k.name)+'" data-kind="'+k.kind+'">'+xn(k.name)+'</button>').join('')+'</div>';
  }

    +'<button class="btn '+(armD?'confirm':'ghost danger')+'" data-act="discard">'+(armD?'Tap again to discard':'Discard')+'</button></div>';
  return h;
}

function exCard(a,ex){
  const hist=historyFor(ex.name,a.id); const prev=prevFor(ex,a); const range=parseRange(ex.range);
  const pSets=prev?prev.ex.sets.filter(x=>hasData(x,prev.ex.kind)):[]; const hasLast=pSets.length>0;
  const f=fieldsOf(ex); const c1=f.length===1;
  const SB=ssBlocks(a), sb=SB[ex.id], idx=a.exercises.indexOf(ex), nxt=a.exercises[idx+1];
  let h='<section class="ex'+(sb?' ss'+(sb.pos>0?' ss-cont':'')+(sb.pos<sb.size-1?' ss-more':''):'')+'" id="ex-'+ex.id+'">';
  if(sb&&sb.pos===0) h+='<div class="ss-band">Superset '+sb.letter+' · '+sb.size+' exercises, back to back</div>';
  h+='<div class="ex-h"><span class="plate '+ex.kind+'" title="'+esc(KINDS[ex.kind])+'"></span><div class="ex-title"><h3>'+xn(ex.name)+'</h3><div class="ex-tools">';
  if(ex.kind==='strength'){
    h+='<label class="range">Reps<input id="rg-'+ex.id+'" data-range="'+ex.id+'" value="'+esc(ex.range||'')+'" placeholder="8-12" inputmode="text" autocomplete="off" aria-label="Target rep range"></label>';
    h+='<button class="chip" data-act="bw" data-ex="'+ex.id+'" aria-pressed="'+(!!ex.bw)+'">BW</button>';
    h+='<button class="chip unit" data-act="unit-ex" data-ex="'+ex.id+'" aria-label="Weight unit for this exercise: '+exU(ex)+'. Tap to switch."><b>'+exU(ex)+'</b> ⇄</button>';
  }
  h+='<button class="chip kind-chip" data-act="kind-open" data-ex="'+ex.id+'" aria-expanded="'+(S.kindEx===ex.id)+'" title="Change how this exercise is measured">'+(ex.kind==='strength'?'Type':esc(KINDS[ex.kind]))+' ▾</button>';
  if(sb) h+='<button class="chip ssc" data-act="ss-unlink" data-ex="'+ex.id+'" aria-pressed="true" title="Remove from superset">'+sb.label+' ✕</button>';
  if(a.exercises.length>1&&!(sb&&sb.size>=a.exercises.length)) h+='<button class="chip" data-act="ss-open" data-ex="'+ex.id+'" aria-expanded="'+(S.ssEx===ex.id)+'" title="Superset this with another exercise">⛓ '+(sb?'Add to '+sb.letter:'Superset')+' ▾</button>';
  const armed=S.confirm==='rmex:'+ex.id;
  h+='</div></div><button class="x'+(armed?' armed':'')+'" data-act="rm-ex" data-ex="'+ex.id+'" aria-label="Remove exercise">'+(armed?'Remove':'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>')+'</button></div>';
  if(S.kindEx===ex.id) h+='<div class="kind-pick"><span class="eyebrow">Measure this exercise by</span><div class="row-btns">'+Object.entries(KINDS).map(([k,l])=>'<button class="btn small'+(k===ex.kind?' primary':' ghost')+'" data-act="set-kind" data-ex="'+ex.id+'" data-kind="'+k+'">'+esc(l)+'</button>').join('')+'</div><span class="muted" style="font-size:12px">Switching clears the sets in this card. Past workouts stay as they are.</span></div>';
  if(S.ssEx===ex.id){
    const others=a.exercises.filter(x=>x!==ex&&!(sb&&sb.ids.includes(x.id)));
    h+='<div class="kind-pick"><span class="eyebrow">'+(sb?'Add to superset '+sb.letter:'Superset '+esc(ex.name)+' with')+'</span><div class="ss-opts">'
      +others.map(x=>{ const ob=SB[x.id]; return '<button class="btn small ghost" data-act="ss-pick" data-ex="'+ex.id+'" data-to="'+x.id+'"><span>'+xn(x.name)+'</span><small>'+(ob?'now in '+ob.label+', moves out':'#'+(a.exercises.indexOf(x)+1))+'</small></button>' }).join('')
      +'</div><span class="muted" style="font-size:12px">The one you pick moves to sit right after '+(sb?'this superset':esc(ex.name))+'. Only that exercise changes.</span></div>';
  }

  h+='<div class="cmp">';
  if(!hist.length) h+='<div class="muted">First time logging this one. Today sets the baseline.</div>';
  const usingOld=prev&&hist[0]&&hist[0].session.id!==prev.session.id;
  const cmpRows=[]; if(prev) cmpRows.push({p:prev,l:usingOld?'Using':'Last'});
  cmpRows.forEach(({p,l})=>{ h+='<div class="cmp-row"><span class="when">'+l+'<small>'+esc(fmtDate(p.session.startedAt))+'</small></span><div class="sets-txt">'+grouped(p.ex,exU(ex))+'</div></div>' });
  if(hist.length>1){
    const open=S.exHist===ex.id;
    h+='<button class="link exh-btn" data-act="ex-hist" data-ex="'+ex.id+'" aria-expanded="'+open+'">'+(open?'Hide dates ▴':'Other dates ('+hist.length+') ▾')+'</button>';
    if(open) h+='<div class="exh"><span class="muted" style="font-size:12px">Tap a day to copy its sets and compare against it. Sets you\'ve already done stay.</span>'+hist.slice(0,20).map(x=>{ const st=stats(x.ex); const cur=prev&&x.session.id===prev.session.id;
      return '<button data-act="ex-use" data-ex="'+ex.id+'" data-sid="'+x.session.id+'" aria-current="'+cur+'"><span class="d">'+esc(fmtDate(x.session.startedAt))+'<small>'+esc(sessionName(x.session))+'</small></span><span class="sets-txt">'+grouped(x.ex,exU(ex))+'</span>'+(ex.kind==='strength'&&!x.ex.bw&&st.top?'<span class="top">'+num(conv(st.top,'kg',exU(ex)),1)+'</span>':'')+'</button>' }).join('')+'</div>';
  }
  if(prev&&ex.kind==='strength'&&range&&!prev.ex.bw){ const ps=prev.ex.sets.filter(s=>hasData(s,'strength')); if(ps.length&&ps.every(s=>s.r>=range.hi)) h+='<div class="cue">You hit '+range.hi+'+ reps on every set last time. Try a heavier weight.</div>' }
  h+='</div>';

  h+='<div class="sets'+(hasLast?' wl':'')+'"><div class="srow hd'+(c1?' c1':'')+'"><span>Set</span>'+(hasLast?'<span>'+(usingOld?esc(fmtDate(prev.session.startedAt)):'Last')+'</span>':'')+f.map(x=>'<span>'+(x[0]==='w'?(ex.bw?'+':'')+exU(ex):x[1])+'</span>').join('')+'<span></span></div>';
  ex.sets.forEach((s,i)=>{
    const sug=suggest(ex,i,prev); const st=ex.kind==='strength'&&!s.pre?repStatus(s.r,range):'';
    h+='<div class="srow'+(c1?' c1':'')+(s.done?' done':'')+(s.pre?' pre':'')+'" id="row-'+ex.id+'-'+i+'"><span class="sn '+st+'" id="sn-'+ex.id+'-'+i+'">'+(i+1)+'</span>';
    if(hasLast){ const ps=pSets[i]; h+='<span class="last" id="ls-'+ex.id+'-'+i+'">'+(ps?esc(setLabel(ps,prev.ex,exU(ex))):'<span class="muted">–</span>')+'<span id="mk-'+ex.id+'-'+i+'">'+setMark(s,ex,ps,prev.ex)+'</span></span>' }
    f.forEach(([k,lab,mode])=>{ h+='<input class="in" id="in-'+ex.id+'-'+i+'-'+k+'" data-ex="'+ex.id+'" data-i="'+i+'" data-k="'+k+'" inputmode="'+mode+'" enterkeyhint="next" autocomplete="off" value="'+(isHint(s,k)?'':esc(fieldVal(s[k],k,ex.kind)))+'" placeholder="'+esc(isHint(s,k)?fieldVal(hintsOf(s)[k],k,ex.kind):(sug?fieldVal(sug[k],k,ex.kind):''))+'" aria-label="'+lab+', set '+(i+1)+'">' });
    h+='<button class="tick" data-act="tick" data-ex="'+ex.id+'" data-i="'+i+'" aria-pressed="'+(!!s.done)+'" aria-label="Mark set '+(i+1)+' done"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></button></div>';
    (s.drops||[]).forEach((d,j)=>{
      const pd=hasLast&&pSets[i]&&pSets[i].drops?liveDrops(pSets[i].drops)[j]:null;
      h+='<div class="srow drop'+(c1?' c1':'')+(d.done?' done':'')+(d.pre?' pre':'')+'" id="row-'+ex.id+'-'+i+'-d'+j+'"><button class="dx" data-act="rm-drop" data-ex="'+ex.id+'" data-i="'+i+'" data-j="'+j+'" aria-label="Remove drop '+(j+1)+' of set '+(i+1)+'">↘</button>';
      if(hasLast) h+='<span class="last">'+(pd?esc(num(conv(pd.w||0,exU(prev.ex),exU(ex)),1)+'×'+pd.r):'')+'</span>';
      [['w',exU(ex),'decimal'],['r','reps','numeric']].forEach(([k,lab,mode])=>{ h+='<input class="in" id="in-'+ex.id+'-'+i+'-d'+j+'-'+k+'" data-ex="'+ex.id+'" data-i="'+i+'" data-dj="'+j+'" data-k="'+k+'" inputmode="'+mode+'" enterkeyhint="next" autocomplete="off" value="'+(isHint(d,k)||d[k]==null?'':esc(String(d[k])))+'" placeholder="'+(isHint(d,k)?esc(String(hintsOf(d)[k])):'')+'" aria-label="Drop '+(j+1)+' '+lab+', set '+(i+1)+'">' });
      h+='<button class="tick" data-act="tick-drop" data-ex="'+ex.id+'" data-i="'+i+'" data-j="'+j+'" aria-pressed="'+(!!d.done)+'" aria-label="Mark drop '+(j+1)+' done"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></button></div>';
    });
  });
  h+='</div>';
  h+='<div class="ex-f"><span class="live" id="live-'+ex.id+'">'+liveLine(ex,prev)+'</span><div class="row-btns">'
    +(ex.sets.length>1?'<button class="btn small ghost" data-act="rm-set" data-ex="'+ex.id+'" aria-label="Remove last set">− Set</button>':'')
    +(ex.kind==='strength'&&!ex.bw?'<button class="btn small ghost" data-act="add-drop" data-ex="'+ex.id+'" title="Add a drop to the set you just did">↘ Drop</button>':'')
    +'<button class="btn small" data-act="add-set" data-ex="'+ex.id+'">+ Set</button></div></div>';
  h+='<input class="note-in" data-note="'+ex.id+'" id="nt-'+ex.id+'" value="'+esc(ex.note||'')+'" placeholder="Note (seat height, grip, how it felt)" autocomplete="off" aria-label="Exercise note">';
  return h+'</section>';
}

/* supersets: consecutive exercises sharing ex.ss form one block, labelled A, B, C… */
/* tidy after any change: each run of 2+ gets its own fresh id, a lone leftover is cleared, so stale links never rejoin */
function normSS(sess){
  const ex=sess.exercises; let i=0;
  while(i<ex.length){
    let j=i; if(ex[i].ss){ while(j+1<ex.length&&ex[j+1].ss===ex[i].ss) j++ }
    if(j>i){ const id='s'+newId(); for(let k=i;k<=j;k++) ex[k].ss=id } else ex[i].ss=null;
    i=j+1;
  }
}
function ssBlocks(sess){
  const out={}; const ex=sess.exercises; let letter=0, i=0;
  while(i<ex.length){
    let j=i; if(ex[i].ss){ while(j+1<ex.length&&ex[j+1].ss===ex[i].ss) j++ }
    if(j>i){ const L=String.fromCharCode(65+(letter++%26)); for(let k=i;k<=j;k++) out[ex[k].id]={letter:L,pos:k-i,size:j-i+1,label:L+(k-i+1),first:ex[i].id,ids:ex.slice(i,j+1).map(e=>e.id)} }
    i=j+1;
  }
  return out;
}
/* drop sets: set.drops = [{w,r,done,pre}], done straight after the set with no rest */
const liveDrops=d=>(d||[]).filter(x=>x&&x.r>0&&!x.pre);
function hintsOf(o){ if(!o) return null; if(o.hv) return o.hv; if(o.pre) return {w:o.w,r:o.r,t:o.t,d:o.d}; return null }
function isHint(o,k){ const hv=hintsOf(o); return !!(hv&&!o.done&&!(o.ty&&o.ty[k])&&hv[k]!=null) }
function typeInto(o,k,raw,val){
  if(!o.hv&&o.pre) o.hv={w:o.w,r:o.r,t:o.t,d:o.d};
  o.ty=o.ty||{};
  if(String(raw).trim()===''&&o.hv){ delete o.ty[k]; o[k]=o.hv[k]; if(!Object.keys(o.ty).length&&!o.done) o.pre=true; return }
  o.ty[k]=true; o[k]=val; o.pre=false;
}
function dropW(w,u){ if(!(w>0)) return null; const step=u==='lb'?5:2.5; return Math.max(step,Math.round(w*0.8/step)*step) }
function afterSet(a,ex,i){
      const sb=ssBlocks(a)[ex.id];
      if(sb&&sb.pos<sb.size-1){
        const nx=exOf(sb.ids[sb.pos+1]); render();
        if(nx){ while(nx.sets.length<=i){ const ls=nx.sets[nx.sets.length-1]; nx.sets.push(ls&&hasData(ls,nx.kind)?{w:ls.w,r:ls.r,t:ls.t,d:ls.d,done:false,pre:true}:blankSet()); save(a); render() }
          const row=document.getElementById('row-'+nx.id+'-'+i); if(row){ row.scrollIntoView({block:'center',behavior:'smooth'}); row.classList.add('flash'); setTimeout(()=>row.classList.remove('flash'),1200) }
          toast('Next: '+sb.letter+(sb.pos+2)+' '+nx.name+' · set '+(i+1)) }
        return }
      if(ex.kind!=='cardio') startRest(S.settings.rest);
      render();
      if(sb){ const first=exOf(sb.first); if(first&&first.sets[i+1]){ const row=document.getElementById('row-'+first.id+'-'+(i+1)); if(row) setTimeout(()=>row.scrollIntoView({block:'center',behavior:'smooth'}),50) } toast('Round done · rest, then '+sb.letter+'1 set '+(i+2)) }
}
function exProgress(ex){ const n=ex.sets.length, d=ex.sets.filter(s=>hasData(s,ex.kind)&&!s.pre).length; return {n,d} }
function reorderView(a){
  const lastDone=a.exercises.reduce((m,ex,i)=>exProgress(ex).d?i:m,-1);
  let h='<section class="card reorder"><div class="ro-h"><div><span class="eyebrow">Reorder</span><h2>Exercise order</h2></div><button class="btn small primary" data-act="ro-done">Done</button></div>'
    +'<p class="muted" style="margin:0;font-size:13px">Move exercises with the arrows. <b>Do next</b> puts one right after what you\'ve already done.</p><ol class="ro-list">';
  a.exercises.forEach((ex,i)=>{
    const pr=exProgress(ex), started=pr.d>0;
    const rb=ssBlocks(a)[ex.id];
    h+='<li class="ro-item'+(started?' started':'')+(rb?' ss':'')+'"><span class="ro-n">'+(rb?rb.label:(i+1))+'</span><span class="plate '+ex.kind+'"></span>'
      +'<span class="ro-name"><b>'+xn(ex.name)+'</b><small>'+(pr.d?pr.d+' of '+pr.n+' sets done':pr.n+' sets')+'</small></span>'
      +'<span class="ro-btns">'
      +(!started&&i!==lastDone+1?'<button class="btn small ro-next" data-act="ro-next" data-ex="'+ex.id+'">Do next</button>':'')
      +'<button class="icon-btn" data-act="ro-move" data-d="-1" data-ex="'+ex.id+'" aria-label="Move '+esc(ex.name)+' up"'+(i===0?' disabled':'')+'>↑</button>'
      +'<button class="icon-btn" data-act="ro-move" data-d="1" data-ex="'+ex.id+'" aria-label="Move '+esc(ex.name)+' down"'+(i===a.exercises.length-1?' disabled':'')+'>↓</button>'
      +'</span></li>';
  });
  return h+'</ol></section>';
}
function deltaPill(cur,last,lowerBetter){
  if(!(last>0)||!(cur>0)) return '';
  const p=(cur-last)/last*100; const better=lowerBetter?p<0:p>0;
  if(Math.abs(p)<.5) return '<span class="delta">same as last</span>';
  return '<span class="delta '+(better?'up':'down')+'">'+(p>0?'+':'')+num(p,0)+'% vs last</span>';
}
function liveLine(ex,prev){
  const s=stats(ex); if(!s.sets) return 'Tap ✓ to log a set';
  const p=prev?stats(prev.ex):null;
  if(ex.kind==='strength'){
    if(ex.bw||!s.ton) return '<b>'+s.sets+' sets</b> · '+s.reps+' reps'+(p?deltaPill(s.reps,p.reps):'');
    return '<b>'+s.sets+' sets</b> · '+num(conv(s.ton,'kg',exU(ex)),0)+' '+exU(ex)+(p?deltaPill(s.ton,p.ton):'');
  }
  if(ex.kind==='sprint') return '<b>'+s.sets+' sprints</b>'+(s.best?' · best '+num(s.best,2)+' s':'')+(s.dist?' · '+num(s.dist,0)+' m':'')+(p&&s.best&&p.best?deltaPill(s.best,p.best,true):'');
  if(ex.kind==='cardio'&&exDU(ex)==='m') return '<b>'+num(s.distm||0,0)+' m</b> · '+fmtT(s.time)+(s.pace100?' · '+fmtT(s.pace100)+'/100 m':'')+(p?deltaPill(s.dist,p.dist):'');
  if(ex.kind==='cardio') return '<b>'+num(s.dist,2)+' km</b> · '+fmtT(s.time)+(s.pace?' · '+fmtT(s.pace)+'/km':'')+(p?deltaPill(s.dist,p.dist):'');
  return '<b>'+fmtT(s.total)+'</b> total'+(p?deltaPill(s.total,p.total):'');
}

    +'<button class="btn block primary" data-act="start">Start empty workout</button>'+unitSwitch()+'</section>';
  const seen=new Map(); fin.forEach(s=>{ const k=norm(sessionName(s)); if(!seen.has(k)) seen.set(k,{name:sessionName(s),s}) });

        let r='<div class="tpl-row"><button data-act="repeat" data-name="'+esc(t.name)+'"'+(t.s?' data-id="'+t.s.id+'"':'')+'><span class="tm"><span class="tn">'+esc(t.name)+'</span><span class="ts">'+esc(names.concat(extra.map(e=>e.name)).join(', '))+'</span></span><span class="go">'+(extra.length?'+'+extra.length+' new':t.s?esc(fmtDate(t.s.startedAt)):'New')+' →</span></button>'
          +(past.length>1?'<button class="dates" data-act="tpl-dates" data-k="'+esc(norm(t.name))+'" aria-expanded="'+open+'">'+past.length+' dates '+(open?'▴':'▾')+'</button>':'')+'</div>';
        if(open) r+='<div class="tpl-dates"><span class="eyebrow">Copy which '+esc(t.name)+'?</span>'+past.slice(0,S.tplAll?999:10).map((x,i)=>'<button data-act="repeat" data-id="'+x.id+'" data-name="'+esc(t.name)+'"><span class="tm"><span class="tn" style="font-size:16px">'+esc(fmtDate(x.startedAt,{weekday:'short',day:'numeric',month:'short',year:new Date(x.startedAt).getFullYear()!==new Date().getFullYear()?'numeric':undefined}))+(i===0?' · latest':'')+'</span><span class="ts">'+x.exercises.length+' exercises · '+sessionSets(x)+' sets · '+esc(x.exercises.map(e=>e.name).join(', '))+'</span></span><span class="go">Copy →</span></button>').join('')
          +(past.length>10&&!S.tplAll?'<button class="more" data-act="tpl-all">Show all '+past.length+'</button>':'')+'</div>';
        return r }).join('')
      +'</div><p class="muted" style="margin:0;font-size:13px">Opens a copy of that workout with every set filled in. Tap ✓ to keep a set as-is, or type over it.</p></section>';
  } else if(!S.demo){
    h+='<section class="card empty"><h2 class="big" style="font-size:28px">Your first log</h2><p>Start a workout, add exercises, and tap ✓ after each set. The rest timer starts on its own. Next time, last session\'s numbers show up as hints.</p>'
      +'<p style="display:flex;gap:16px;flex-wrap:wrap"><button class="link" data-act="imp-open">Import my spreadsheet</button><button class="link" data-act="demo-on">See it with example data</button><label class="link" style="cursor:pointer">Restore a backup<input type="file" class="bk-file" accept=".json,application/json" hidden></label></p></section>';
  }
  return h;

function summaryCard(s){
  const prs=[];
  s.exercises.forEach(ex=>{
    const hist=historyFor(ex.name,s.id).filter(h=>h.session.startedAt<s.startedAt); if(!hist.length) return;
    const cur=stats(ex);
    if(ex.kind==='strength'&&!ex.bw){ const best=Math.max(...hist.map(h=>stats(h.ex).e1rm)); if(cur.e1rm>best+1e-9) prs.push(ex.name+': est. 1RM '+showW(cur.e1rm)) }
    else if(ex.kind==='strength'){ const best=Math.max(...hist.map(h=>stats(h.ex).reps)); if(cur.reps>best) prs.push(ex.name+': '+cur.reps+' total reps') }
    else if(ex.kind==='sprint'){ const bs=hist.map(h=>stats(h.ex).best).filter(x=>x>0); if(cur.best&&bs.length&&cur.best<Math.min(...bs)) prs.push(ex.name+': fastest '+num(cur.best,2)+' s') }
    else if(ex.kind==='cardio'){ const best=Math.max(...hist.map(h=>stats(h.ex).dist)); if(cur.dist>best) prs.push(ex.name+': '+(exDU(ex)==='m'?num(cur.distm,0)+' m':num(cur.dist,2)+' km')) }
    else { const best=Math.max(...hist.map(h=>stats(h.ex).max)); if(cur.max>best) prs.push(ex.name+': '+fmtT(cur.max)+' hold') }
  });
  return '<section class="card summary"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="eyebrow">Workout done · '+esc(sessionName(s))+'</span><button class="btn small ghost" data-act="dismiss">Close</button></div>'
    +'<div class="stats"><div class="stat"><b>'+fmtT((s.finishedAt-s.startedAt)/1000)+'</b><span>Time</span></div><div class="stat"><b>'+sessionSets(s)+'</b><span>Sets</span></div><div class="stat"><b>'+num(conv(sessionTon(s),'kg',P.unit),0)+'</b><span>'+P.unit+' moved</span></div></div>'
    +(prs.length?prs.map(p=>'<div class="pr">'+esc(p)+'</div>').join(''):'')+'</section>';
}

function ymdOf(ms){ const d=new Date(ms); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0') }
/* ---------- backup / restore (moves everything between phones or app versions) ---------- */
const BK_ROW='<div class="row-btns" style="margin-top:8px"><button class="btn small ghost" data-act="bk-save">⤓ Back up</button><label class="btn small ghost" style="cursor:pointer">⤒ Restore<input type="file" class="bk-file" accept=".json,application/json" hidden></label></div>';
function bkData(){ return {app:'nass-strength',v:1,at:Date.now(),sessions:S.sessions,prefs:P,settings:S.settings,food:{goals:F.goals,foods:F.foods,days:F.days}} }
async function bkSave(){
  const name='Nass Strength backup '+ymdOf(Date.now())+'.json', text=JSON.stringify(bkData());
  if(window.claude&&typeof window.claude.use==='function'){
    try{ const dl=await window.claude.use('downloads'); if(dl){ await dl.save({filename:name,data:text}); toast('Backup saved'); return } }
    catch(e){ if(e&&e.code==='declined'){ toast('Backup cancelled'); return } }
  }
  const file=new File([text],name,{type:'application/json'});
  if(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file]}); toast('Backup saved'); return }catch(e){ if(e&&e.name==='AbortError') return }
  }
  try{ const url=URL.createObjectURL(file), a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); toast('Backup saved') }
  catch(e){ toast('Saving files isn\'t available here') }
}
function bkRestore(text){
  let d=null; try{ d=JSON.parse(text) }catch(e){}
  if(!d||!Array.isArray(d.sessions)){ toast('That file isn\'t a Nass Strength backup'); return }
  let added=0, updated=0;
  d.sessions.forEach(x=>{ if(!x||!x.id) return; const i=S.sessions.findIndex(y=>y.id===x.id); if(i<0){ S.sessions.push(x); added++ } else { S.sessions[i]=x; updated++ } });
  persistLocal(); d.sessions.forEach(x=>{ if(x&&x.id) save(S.sessions.find(y=>y.id===x.id)) });
  if(d.prefs&&typeof d.prefs==='object'){ Object.keys(d.prefs).forEach(k=>{ P[k]=d.prefs[k] }); savePrefs(); invalidateNames() }
  if(d.settings&&typeof d.settings==='object'){ Object.assign(S.settings,d.settings); lsSet(LS_SET,S.settings) }
  const f=d.food;
  if(f&&typeof f==='object'){
    if(f.goals) F.goals=Object.assign(GOALS0(),f.goals);
    if(Array.isArray(f.foods)){ const have=new Set(F.foods.map(x=>JSON.stringify(x))); f.foods.forEach(x=>{ if(!have.has(JSON.stringify(x))) F.foods.push(x) }) }
    fdSaveMeta();
    if(f.days&&typeof f.days==='object') Object.keys(f.days).forEach(day=>{ if(Array.isArray(f.days[day])&&f.days[day].length){ F.days[day]=f.days[day]; fdSaveDay(day) } });
  }
  if(S.demo) S.demo=false;
  render(); toast('Restored: '+added+' new workout'+(added===1?'':'s')+(updated?', '+updated+' updated':''));
}
document.addEventListener('change',e=>{
  const el=e.target; if(!el||!el.classList||!el.classList.contains('bk-file')) return;
  const file=el.files&&el.files[0]; el.value=''; if(!file) return;
  file.text().then(bkRestore).catch(()=>toast('Couldn\'t read that file'));
});

      h+='<button class="h-trash'+(armedRow?' armed':'')+'" data-act="hist-del" data-id="'+s.id+'" aria-label="'+(armedRow?'Tap again to delete this workout':'Delete this workout')+'">'+(armedRow?'Delete?':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>')+'</button></div>'; }
    if(open){
      const HB=ssBlocks(s);
      h+='<div class="h-body">'+s.exercises.map(ex=>'<div class="h-ex"><span class="plate '+ex.kind+'"></span><div><h4>'+(HB[ex.id]?'<span class="sstag">'+HB[ex.id].label+'</span> ':'')+xn(ex.name)+(ex.kind==='strength'&&!ex.bw?' <small>· '+exU(ex)+'</small>':'')+(ex.range?' <small>· '+esc(ex.range)+' reps</small>':'')+'</h4><div class="sets-txt">'+(grouped(ex)||'<span class="muted">No sets</span>')+'</div>'+(ex.note?'<div class="nt">'+esc(ex.note)+'</div>':'')+'</div></div>').join('');
      const armed=S.confirm==='del:'+s.id;
      h+='<label class="h-dt"><span>Date</span><input type="date" class="sel" data-hdate="'+s.id+'" value="'+ymdOf(s.startedAt)+'" aria-label="Workout date"></label>';
      h+='<div class="row-btns"><button class="btn small" data-act="repeat" data-id="'+s.id+'">Repeat this workout</button><button class="btn small '+(armed?'confirm':'ghost danger')+'" data-act="hist-del" data-id="'+s.id+'">'+(armed?'Tap again to delete':'Delete')+'</button></div></div>';
    }
    h+='</article>';
  });
  return h;
}

const METRICS={
  strength:[['top','Top set','kg'],['e1rm','Est. 1RM','kg'],['reps','Total reps','n'],['ton','Tonnage','kg'],['sets','Sets','n']],
  bw:[['reps','Total reps','n'],['sets','Sets','n'],['top','Added weight','kg']],
  cardio:[['dist','Distance','km'],['pace','Pace','pace'],['time','Time','time']],
  cardioM:[['distm','Distance','m'],['pace100','Pace /100 m','pace100'],['time','Time','time']],
  sprint:[['best','Fastest','sec'],['speed','Top speed','mps'],['dist','Total distance','m'],['sets','Sprints','n']],
  time:[['max','Longest hold','time'],['total','Total time','time']]
};
function fmtMetric(v,u,axis){ if(u==='sec') return num(v,axis?1:2)+(axis?'':' s'); if(u==='m') return num(v,0)+(axis?'':' m'); if(u==='mps') return num(v,2)+(axis?'':' m/s'); if(u==='pace100') return fmtT(v)+(axis?'':' /100 m'); if(u==='kg'){ const x=conv(v,'kg',P.unit); return num(x,axis?0:1)+(axis?'':' '+P.unit) } if(u==='km') return num(v,2)+(axis?'':' km'); if(u==='time') return fmtT(v); if(u==='pace') return fmtT(v)+(axis?'':' /km'); return num(v,0) }

function viewProgress(){
  const fin=finished();
  const names=knownExercises().filter(k=>k.count&&historyFor(k.name).length);
  if(!names.length) return '<section class="card empty"><h2 class="big" style="font-size:28px">Charts come next</h2><p>Finish a workout and each exercise gets its own progress chart here.</p>'+(S.demo?'':'<p><button class="link" data-act="demo-on">See it with example data</button></p>')+'</section>';
  let cur=names.find(n=>S.progressEx&&n.g===gid(S.progressEx))||names[0]; S.progressEx=cur.name;
  const hist=historyFor(cur.name).slice().reverse();
  const isBw=cur.kind==='strength'&&hist.length&&hist[hist.length-1].ex.bw;
  const lastEx=hist.length?hist[hist.length-1].ex:null;
  const ms=METRICS[isBw?'bw':(cur.kind==='cardio'&&lastEx&&exDU(lastEx)==='m')?'cardioM':cur.kind]||METRICS.strength;
  let m=ms.find(x=>x[0]===S.metric)||ms[0]; S.metric=m[0];
  const lower=m[0]==='pace'||m[0]==='pace100'||m[0]==='best';
  const pts=hist.map(h=>({x:h.session.startedAt,y:stats(h.ex)[m[0]]})).filter(p=>p.y!=null&&p.y>0);
  let h='<select class="sel" id="prog-ex" aria-label="Exercise">'+names.map(n=>'<option'+(n.name===cur.name?' selected':'')+'>'+esc(xt(n.name))+'</option>').join('')+'</select>';
  h+=unitSwitch();
  h+='<div class="seg" role="group" aria-label="Measure">'+ms.map(x=>'<button data-act="metric" data-m="'+x[0]+'" aria-pressed="'+(x[0]===m[0])+'">'+x[1]+'</button>').join('')+'</div>';
  if(!pts.length){ h+='<section class="card"><p class="muted" style="margin:0">No '+esc(m[1].toLowerCase())+' logged for this exercise yet.</p></section>'; return h }
  const last=pts[pts.length-1], prevP=pts.length>1?pts[pts.length-2]:null;
  const best=lower?Math.min(...pts.map(p=>p.y)):Math.max(...pts.map(p=>p.y));
  h+='<section class="card"><div class="kpi"><div><span class="eyebrow">'+esc(m[1])+' · latest</span><div class="big">'+esc(fmtMetric(last.y,m[2]))+'</div></div>'
    +'<div class="side">'+(prevP?deltaPill(last.y,prevP.y,lower):'')+'<span>Best '+esc(fmtMetric(best,m[2]))+' · '+pts.length+' sessions</span></div></div>'
    +chart(pts,m[2],best)+(lower?'<p class="muted" style="margin:0;font-size:12px">Lower pace is faster.</p>':'')+'</section>';

function niceTicks(lo,hi,n){ const span=hi-lo||1; const raw=span/n; const mag=Math.pow(10,Math.floor(Math.log10(raw))); const e=raw/mag; const step=(e>=7.5?10:e>=3.5?5:e>=1.5?2:1)*mag; const a=Math.floor(lo/step)*step, b=Math.ceil(hi/step)*step; const out=[]; for(let v=a;v<=b+step/2;v+=step) out.push(+v.toFixed(8)); return out }
function chart(pts,unit,best){
  const W=340,H=200,L=40,R=16,Tp=22,B=26;

  if(lo===hi){ lo=lo*0.9; hi=hi*1.1||1 }

  const ticks=niceTicks(lo,hi,4); lo=ticks[0]; hi=ticks[ticks.length-1];

  const X=v=>x1===x0?L+(W-L-R)/2:L+(v-x0)/(x1-x0)*(W-L-R);
  const Y=v=>Tp+(hi-v)/(hi-lo)*(H-Tp-B);

  ticks.forEach(t=>{ const y=Y(t).toFixed(1); s+='<line class="c-grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text class="c-axis" x="'+(L-6)+'" y="'+y+'" dy="4" text-anchor="end">'+esc(fmtMetric(t,unit,true))+'</text>' });
  if(pts.length>1){
    const by=Y(best).toFixed(1); s+='<line class="c-best" x1="'+L+'" x2="'+(W-R)+'" y1="'+by+'" y2="'+by+'"/>';
    const line=pts.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
    s+='<path class="c-area" d="'+line+' L'+X(pts[pts.length-1].x).toFixed(1)+' '+(H-B)+' L'+X(pts[0].x).toFixed(1)+' '+(H-B)+' Z"/><path class="c-line" d="'+line+'"/>';
  }
  pts.forEach((p,i)=>{ if(i<pts.length-1&&pts.length<=40) s+='<circle class="c-dot" cx="'+X(p.x).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="3.5"/>' });
  const e=pts[pts.length-1], ex=X(e.x), ey=Y(e.y);
  s+='<circle class="c-end" cx="'+ex.toFixed(1)+'" cy="'+ey.toFixed(1)+'" r="5.5"/>';
  const ly=ey<Tp+14?ey+18:ey-10;
  s+='<text class="c-endlab" x="'+ex.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="'+(ex>W-60?'end':ex<L+40?'start':'middle')+'">'+esc(fmtMetric(e.y,unit))+'</text>';
  s+='<text class="c-axis" x="'+L+'" y="'+(H-6)+'" text-anchor="start">'+esc(fmtDate(x0))+'</text>';
  if(x1!==x0) s+='<text class="c-axis" x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+esc(fmtDate(x1))+'</text>';
  return s+'</svg>';
}

    if(FC.metaDirty||!snap.exists) return;
    const v=JSON.parse(JSON.stringify(snap.data()||{}));
    const goals=Object.assign(GOALS0(),v.goals||{}), foods=Array.isArray(v.foods)?v.foods:[];
    if(JSON.stringify(goals)===JSON.stringify(F.goals)&&JSON.stringify(foods)===JSON.stringify(F.foods)) return;
    F.goals=goals; F.foods=foods; fdLocal(); fdRefresh();
  },()=>{ FC.meta=null }) }catch(e){}
  try{ col.onSnapshot(snap=>{
    if(!FC.ready){ if(snap.metadata.fromCache) return; FC.ready=true; FC.col=col;
      if(!seen){ const ids=new Set(snap.docs.map(x=>x.id)); Object.keys(F.days).forEach(d=>{ if(!ids.has(d)&&fdItems(d).length) fdSaveDay(d) }); lsSet(LS_FOOD_SEEN,true) } }
    const next={}; snap.docs.forEach(x=>{ const v=x.data(); if(v&&Array.isArray(v.items)&&v.items.length) next[x.id]=JSON.parse(JSON.stringify(v.items)) });
    FC.dirty.forEach(d=>{ if(fdItems(d).length) next[d]=F.days[d]; else delete next[d] });
    if(fdSig(next)===fdSig(F.days)) return;
    F.days=next; fdLocal(); fdRefresh();
  },()=>{ FC.col=null }) }catch(e){}
}

/* saved foods */
function fdRemember(o){
  const n=String(o.n||'').trim(); if(!n) return;
  let f=F.foods.find(x=>norm(x.n)===norm(n));
  if(!f){ f={id:newId(),n,count:0}; F.foods.push(f) }
  Object.assign(f,{n,serv:o.serv||'',kcal:o.kcal,p:o.p,c:o.c,f:o.f,last:Date.now()}); f.count=(f.count||0)+1;
  if(F.foods.length>400){ F.foods.sort((a,b)=>(b.last||0)-(a.last||0)); F.foods.length=400 }
  fdSaveMeta();
}
function fdAddItems(list,meal,remember){
  const d=FU.date; const day=(F.days[d]||[]).slice();
  list.forEach(o=>{ day.push({id:newId(),n:o.n,serv:o.serv||'',meal,q:o.q==null?1:o.q,kcal:o.kcal,p:o.p,c:o.c,f:o.f,at:Date.now()}); if(remember) fdRemember(o) });
  F.days[d]=day; fdSaveDay(d);
}

function viewFood(){

    if(its.length) h+='<div class="fd-list">'+its.map(i=>'<button class="fd-it" data-act="fd-edit" data-id="'+i.id+'"><span class="fd-in"><b>'+esc(i.n)+'</b><small>'+esc(fdQty(i))+' · P '+num(fdVal(i,'p'),0)+' · C '+num(fdVal(i,'c'),0)+' · F '+num(fdVal(i,'f'),0)+'</small></span><span class="fd-ik">'+num(fdVal(i,'kcal'),0)+'</span></button>').join('')+'</div>';
    h+='</section>';
  });

  return h;
}
function fdWeek(d){
  const days=[]; for(let i=6;i>=0;i--){ const k=fdShift(d,-i); const its=fdItems(k); days.push({k,t:fdTot(its),n:its.length}) }
  const logged=days.filter(x=>x.n); if(!logged.length) return '';
  const avg=k=>logged.reduce((a,x)=>a+x.t[k],0)/logged.length;
  const G=F.goals; const max=Math.max(G.kcal||0,...days.map(x=>x.t.kcal))*1.12||1;
  const W=340,H=150,B=22,Tp=16,bw=(W-16)/7, Y=v=>H-B-(H-B-Tp)*v/max;
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Calories, last 7 days">';
  s+='<line class="c-grid" x1="8" x2="'+(W-8)+'" y1="'+(H-B)+'" y2="'+(H-B)+'"/>';
  days.forEach((x,i)=>{ const cx=8+bw*i, y=Y(x.t.kcal), bh=H-B-y;
    if(bh>0) s+='<rect class="fd-b'+(x.k===d?' cur':'')+'" x="'+(cx+bw*.18).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw*.64).toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="4"/>';
    if(x.n) s+='<text class="c-axis" x="'+(cx+bw/2).toFixed(1)+'" y="'+(y-5).toFixed(1)+'" text-anchor="middle">'+num(x.t.kcal,0)+'</text>';
    s+='<text class="c-axis'+(x.k===d?' fd-cur':'')+'" x="'+(cx+bw/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(fmtDate(fdMs(x.k),{weekday:'narrow'}))+'</text>' });
  if(G.kcal>0){ const y=Y(G.kcal).toFixed(1); s+='<line class="c-best" x1="8" x2="'+(W-8)+'" y1="'+y+'" y2="'+y+'"/>' }
  s+='</svg>';
  return '<section class="card"><div class="kpi"><div><span class="eyebrow">Last 7 days · daily average</span><div class="big">'+num(avg('kcal'),0)+'<small> kcal</small></div></div>'
    +'<div class="side"><span>Protein '+num(avg('p'),0)+' g · Carbs '+num(avg('c'),0)+' g · Fat '+num(avg('f'),0)+' g</span><span>'+logged.length+' of 7 days logged'+(G.kcal>0?' · dashed line = target':'')+'</span></div></div>'+s+'</section>';
}

/* built-in food database: USDA SR28 (public domain), loaded on first search. Row: [name,kcal,p,c,f,group,[[grams,portion],…]] per 100 g */
const FDB={state:'idle',rows:null,hay:null};
async function fdDbLoad(){
  if(FDB.state==='loading'||FDB.state==='ready') return; FDB.state='loading';
  try{ const r=await fetch('foods-usda.json'); if(!r.ok) throw 0; FDB.rows=await r.json(); FDB.hay=FDB.rows.map(x=>x[0].toLowerCase()); FDB.state='ready' }catch(e){ FDB.state='error' }
  if(FU.sheet==='add'&&FU.mode==='find'){ const l=$('#fd-list'); if(l) l.innerHTML=fdFindList() }
}
function fdDbSearch(q){
  const words=q.toLowerCase().replace(/[^a-z0-9% ]+/g,' ').trim().split(/\s+/).filter(Boolean).map(w=>w.length>3&&/s$/.test(w)&&!/ss$/.test(w)?w.slice(0,-1):w);
  if(!words.length) return [];
  const out=[];
  FDB.hay.forEach((h,i)=>{ if(!words.every(w=>h.includes(w))) return;
    const first=h.split(',')[0]; let sc=h.length/10;
    if(first===words[0]||first===words[0]+'s') sc-=40; else if(h.startsWith(words[0])) sc-=25; else if(first.includes(words[0])) sc-=10;
    if(/\b(raw)\b/.test(h)&&!words.includes('raw')) sc+=4; if(h.includes('restaurant')||h.includes('fast food')) sc+=3; ['dried','dehydrated','powder','frozen','canned','imitation','babyfood'].forEach(w=>{ if(h.includes(w)&&!words.includes(w)) sc+=8 });
    out.push([sc,i]) });
  return out.sort((a,b)=>a[0]-b[0]).slice(0,40).map(x=>x[1]);
}
function fdDbList(q){
  if(!q||q.length<2) return '';
  if(FDB.state==='idle'){ fdDbLoad() }
  if(FDB.state!=='ready') return '<div class="list-h">Food database</div><p class="sheet-note">'+(FDB.state==='error'?'The food database didn\'t load. <button class="link" data-act="fd-db-retry">Try again</button>':'Loading the food database…')+'</p>';
  if(/[가-힣]/.test(q)) return '<div class="list-h">Food database</div><p class="sheet-note">The database is in English. Try an English word (e.g. "chicken breast", "rice"), or use <button class="link" data-act="fd-mode" data-m="ai">Ask Claude</button> for Korean dishes.</p>';
  const hits=fdDbSearch(q);
  let h='<div class="list-h">Food database · USDA · tap to choose an amount</div>';
  if(!hits.length) return h+'<p class="sheet-note">Nothing found for "'+esc(FU.q)+'". Try fewer words, <button class="link" data-act="fd-mode" data-m="ai">Ask Claude</button>, or <button class="link" data-act="fd-mode" data-m="new">add it yourself</button>.</p>';
  return h+hits.map(i=>{ const x=FDB.rows[i]; return '<button class="pick" data-act="fd-dbpick" data-i="'+i+'"><span class="pn">'+esc(x[0])+'<small>per 100 g · P '+num(x[2],0)+' · C '+num(x[3],0)+' · F '+num(x[4],0)+(x[5]?' · '+esc(x[5]):'')+'</small></span><span class="ps">'+num(x[1],0)+' kcal</span></button>' }).join('')
    +'<p class="credit" style="padding-top:8px">Nutrition data: USDA National Nutrient Database for Standard Reference, Release 28 (public domain).</p>';
}
function fdPortions(x){ return x[6].map(p=>({g:p[0],d:p[1]})).concat([{g:100,d:'100 g'},{g:1,d:'grams'}]) }

      if(ex.kind!==k){ const n=Math.max(ex.sets.length,k==='strength'?3:k==='sprint'?4:1);
        ex.kind=k; ex.du=k==='cardio'?duOf(ex.name):undefined; if(k!=='strength') ex.bw=false;
        ex.sets=Array.from({length:n},blankSet);
        const c=P.custom.find(x=>sameEx(x.n,ex.name)); if(c){ c.kind=k; invalidateNames(); savePrefs() }
        save(a); toast(ex.name+': '+KINDS[k]) }
      render(); break }
    case 'ss-open': S.ssEx=S.ssEx===b.dataset.ex?null:b.dataset.ex; S.kindEx=null; render(); break;
    case 'ss-pick': { const ex=exOf(b.dataset.ex), tg=exOf(b.dataset.to); S.ssEx=null; if(!ex||!tg||ex===tg){ render(); break }
      const sb=ssBlocks(a)[ex.id]; const id=sb?ex.ss:('s'+newId());
      ex.ss=id; a.exercises.splice(a.exercises.indexOf(tg),1); tg.ss=id;
      let end=a.exercises.indexOf(ex); while(end+1<a.exercises.length&&a.exercises[end+1].ss===id) end++;
      a.exercises.splice(end+1,0,tg); normSS(a);
      save(a,true); render(); const nb=ssBlocks(a)[tg.id];
      toast(tg.name+' is now '+(nb?nb.label:'')+(sb?' in superset '+nb.letter:' · superset with '+ex.name));
      const el=document.getElementById('ex-'+(nb?nb.first:ex.id)); if(el) el.scrollIntoView({block:'start',behavior:'smooth'}); break }
    case 'ss-unlink': { const ex=exOf(b.dataset.ex); if(!ex||!ex.ss) break; const sb=ssBlocks(a)[ex.id]; const id=ex.ss; ex.ss=null;
      if(sb&&sb.pos<sb.size-1){ a.exercises.splice(a.exercises.indexOf(ex),1); let end=-1; a.exercises.forEach((x,k)=>{ if(x.ss===id) end=k }); a.exercises.splice(end+1,0,ex) }
      normSS(a); save(a,true); render(); toast(ex.name+' removed from the superset'); break }
    case 'rm-ex': { if(prevC!=='rmex:'+b.dataset.ex){ S.confirm='rmex:'+b.dataset.ex; render(); break } a.exercises=a.exercises.filter(x=>x.id!==b.dataset.ex); normSS(a); save(a,true); render(); break }
    case 'tick': {
      const ex=exOf(b.dataset.ex); if(!ex) break; const i=+b.dataset.i; const set=ex.sets[i];
      if(set.done){ set.done=false; save(a); render(); break }
      set.pre=false; delete set.ty; delete set.hv;
      const prev=prevFor(ex,a); const sug=suggest(ex,i,prev);
      if(sug) ['w','r','t','d'].forEach(k=>{ if(set[k]==null&&sug[k]!=null) set[k]=sug[k] });
      if(!hasData(set,ex.kind)){ toast(ex.kind==='strength'?'Enter reps first':'Enter a time first'); const f=document.getElementById('in-'+ex.id+'-'+i+'-'+(ex.kind==='strength'?'r':'t')); if(f) f.focus(); break }
      set.done=true; save(a);
      if(set.drops&&set.drops.some(d=>!d.done)){ render(); const row=document.getElementById('row-'+ex.id+'-'+i+'-d'+set.drops.findIndex(d=>!d.done)); if(row){ row.scrollIntoView({block:'center',behavior:'smooth'}); row.classList.add('flash'); setTimeout(()=>row.classList.remove('flash'),1200) } toast('Drop it straight away · no rest'); break }
      afterSet(a,ex,i); break }
    case 'tick-drop': {
      const ex=exOf(b.dataset.ex); if(!ex) break; const i=+b.dataset.i, j=+b.dataset.j; const set=ex.sets[i]; const d=set&&set.drops&&set.drops[j]; if(!d) break;
      if(d.done){ d.done=false; save(a); render(); break }
      d.pre=false; delete d.ty; delete d.hv; if(!(d.r>0)){ toast('Enter reps for the drop first'); const f=document.getElementById('in-'+ex.id+'-'+i+'-d'+j+'-r'); if(f) f.focus(); break }
      d.done=true; if(!set.done&&hasData(set,ex.kind)){ set.done=true; set.pre=false }
      save(a);
      const nextD=set.drops.findIndex(x=>!x.done);
      if(nextD>=0){ render(); const f=document.getElementById('in-'+ex.id+'-'+i+'-d'+nextD+'-w'); if(f) f.scrollIntoView({block:'center'}); break }
      afterSet(a,ex,i); break }
    case 'add-drop': {
      const ex=exOf(b.dataset.ex); if(!ex) break;
      let i=-1; ex.sets.forEach((x,k)=>{ if(x.done) i=k }); if(i<0) ex.sets.forEach((x,k)=>{ if(hasData(x,ex.kind)&&!x.pre) i=k }); if(i<0) i=ex.sets.length-1;
      const set=ex.sets[i]; set.drops=set.drops||[];
      const prev=prevFor(ex,a); const pd=prev?((prev.ex.sets.filter(x=>hasData(x,prev.ex.kind))[i]||{}).drops||[]).filter(x=>x&&x.r>0)[set.drops.length]:null;
      const base=set.drops.length?set.drops[set.drops.length-1]:set; const u=exU(ex);
      const w=pd?(exU(prev.ex)!==u?niceW(conv(pd.w||0,exU(prev.ex),u)):pd.w):dropW(base.w,u);
      set.drops.push({w,r:pd?pd.r:(base.r||null),done:false,pre:true});
      save(a); render(); const f=document.getElementById('in-'+ex.id+'-'+i+'-d'+(set.drops.length-1)+'-w'); if(f) f.scrollIntoView({block:'center'});
      toast('Drop added to set '+(i+1)); break }
    case 'rm-drop': { const ex=exOf(b.dataset.ex); const set=ex&&ex.sets[+b.dataset.i]; if(!set||!set.drops) break; set.drops.splice(+b.dataset.j,1); if(!set.drops.length) delete set.drops; save(a); render(); break }
    case 'finish': {
      const any=a.exercises.some(ex=>ex.sets.some(s=>hasData(s,ex.kind)&&!s.pre));
      if(!any){ if(prevC!=='finish-empty'){ S.confirm='finish-empty'; render(); break } removeSession(a.id); wakeOff(); render(); break }
      a.exercises.forEach(ex=>{ ex.sets=ex.sets.filter(s=>hasData(s,ex.kind)&&!s.pre).map(s=>{ const c=Object.assign({},s); delete c.pre; delete c.hv; delete c.ty; const ds=liveDrops(c.drops).map(d=>({w:d.w,r:d.r,done:true})); if(ds.length) c.drops=ds; else delete c.drops; return c }) }); a.exercises=a.exercises.filter(ex=>ex.sets.length);
      a.finishedAt=Date.now(); save(a,true); S.justFinished=a.id; T.running=false; T.done=false; wakeOff(); render(); window.scrollTo(0,0); break }
    case 'discard': if(prevC!=='discard'){ S.confirm='discard'; render(); break } removeSession(a.id); T.running=false; wakeOff(); render(); break;
    case 'dismiss': S.justFinished=null; render(); break;
    case 'hist': S.openHist=S.openHist===b.dataset.id?null:b.dataset.id; render(); break;
    case 'hist-del': if(prevC!=='del:'+b.dataset.id){ S.confirm='del:'+b.dataset.id; render(); break } removeSession(b.dataset.id); S.openHist=null; render(); toast('Workout deleted'); break;
    case 'metric': S.metric=b.dataset.m; render(); break;
    case 'demo-on': S.demo=true; S.demoData=makeDemo(); S.justFinished=null; render(); break;
    case 'demo-off': S.demo=false; S.demoData=[]; S.justFinished=null; render(); break;
    case 'rest-preset': S.settings.rest=+b.dataset.v; lsSet(LS_SET,S.settings); renderTimer(); break;
    case 'rest-start': startRest(S.settings.rest); break;
    case 'rest-add': if(T.running){ T.end+= +b.dataset.v*1000; T.dur=Math.max(T.dur+ +b.dataset.v,1); tick() } break;
    case 'rest-skip': T.running=false; T.done=false; renderTimer(); break;
  }
});

view.addEventListener('input',e=>{

  if(t.dataset.note){ const ex=exOf(t.dataset.note); if(!ex) return; ex.note=t.value; save(a); return }
  if(t.dataset.k&&t.dataset.dj!=null){
    const ex=exOf(t.dataset.ex); if(!ex) return; const set=ex.sets[+t.dataset.i]; const d=set&&set.drops&&set.drops[+t.dataset.dj]; if(!d) return;
    typeInto(d,t.dataset.k,t.value,parseNum(t.value)); const row=t.closest('.srow'); if(row) row.classList.toggle('pre',!!d.pre);

view.addEventListener('change',e=>{ if(e.target.id==='prog-ex'){ S.progressEx=e.target.value; render(); return }
  const hid=e.target.dataset&&e.target.dataset.hdate; if(!hid) return;
  const s=byId(hid); const m=String(e.target.value||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); if(!s||!m) return;

function refreshRows(ex){
  const a=active(); const prev=prevFor(ex,a); const range=parseRange(ex.range);
  const pSets=prev?prev.ex.sets.filter(x=>hasData(x,prev.ex.kind)):[];
  ex.sets.forEach((s,i)=>{
    const sug=suggest(ex,i,prev);
    const mk=document.getElementById('mk-'+ex.id+'-'+i); if(mk) mk.innerHTML=setMark(s,ex,pSets[i],prev&&prev.ex);
    const row=document.getElementById('row-'+ex.id+'-'+i); if(row) row.classList.toggle('pre',!!s.pre);
    fieldsOf(ex).forEach(([k])=>{ const el=document.getElementById('in-'+ex.id+'-'+i+'-'+k); if(el) el.placeholder=isHint(s,k)?fieldVal(hintsOf(s)[k],k,ex.kind):(sug?fieldVal(sug[k],k,ex.kind):'') });
    const sn=document.getElementById('sn-'+ex.id+'-'+i); if(sn) sn.className='sn '+(ex.kind==='strength'&&!s.pre?repStatus(s.r,range):'');
  });
  const lv=document.getElementById('live-'+ex.id); if(lv) lv.innerHTML=liveLine(ex,prev);
  const ss=$('#sess-sets'); if(ss) ss.textContent=sessionSets(a)+' sets';
}
